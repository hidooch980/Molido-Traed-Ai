# Production stack for a single VPS.
#
#   caddy → web (Next.js) and api (FastAPI)
#   collector → the long-running data-gathering worker
#   postgres (TimescaleDB) + redis
#
# Postgres and Redis publish **no host ports**: they are reachable only on the
# compose network. A database exposed on a public IP with a weak password is
# the single most common way a VPS gets taken over, and there is no reason to
# expose them — every client lives in this file.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d

name: molidotrade

x-backend-env: &backend-env
  # Which account key reads which mounted bridge directory. Without this the
  # containers fall back to the single built-in terminal, and seven mounted
  # bridges sit unread - which is exactly what happened on the first deploy
  # of the mounts.
  MOLIDO_MT5_BRIDGE_DIRS: ${MOLIDO_MT5_BRIDGE_DIRS:-}
  # Which brain each account trades, "login=strategy,...". Unset means every
  # account trades the incumbent, exactly as before brains were separable.
  MOLIDO_ACCOUNT_STRATEGIES: ${MOLIDO_ACCOUNT_STRATEGIES:-}
  # The council gate: how many brains must agree before an order is sent.
  MOLIDO_CONSENSUS_REQUIRED: ${MOLIDO_CONSENSUS_REQUIRED:-1}
  MOLIDO_ENV: production
  MOLIDO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MOLIDO_REDIS_URL: redis://redis:6379/0
  MOLIDO_LOG_LEVEL: ${MOLIDO_LOG_LEVEL:-INFO}
  MOLIDO_LOG_JSON: "true"
  MOLIDO_MIN_QUALITY_SCORE: ${MOLIDO_MIN_QUALITY_SCORE:-0.80}
  MOLIDO_COLLECTOR_PROVIDER: ${MOLIDO_COLLECTOR_PROVIDER:-yfinance}
  MOLIDO_COLLECTOR_INTERVAL_SECONDS: ${MOLIDO_COLLECTOR_INTERVAL_SECONDS:-900}
  # How hard the autopilot trades, and on which timeframes it decides. Listed
  # here or they do not reach the process at all: the env-file feeds compose
  # substitution, not the container environment, so a variable set there and
  # not named here reads back as its default and looks unset rather than
  # ignored. The defaults below are the conservative pair.
  MOLIDO_AUTOTRADE_RISK_PERCENT: ${MOLIDO_AUTOTRADE_RISK_PERCENT:-0.25}
  # Per-account risk, "login=percent,...", overriding the fleet figure above
  # for the accounts it names and nothing else. The smallest trade a broker
  # accepts is a fixed size, so a $50 account at the fleet's 0.75% computes
  # an order that rounds to zero on every symbol; raising the fleet figure
  # instead would put ten thousand dollars behind every trade on the
  # $196,000 account.
  #
  # Listed here because this anchor is an explicit list, not a passthrough:
  # a variable absent from it is absent from the container, and the setting
  # then silently keeps its default while the env file says otherwise. That
  # is what happened when this was first set - the file was right, the
  # container was unchanged, and nothing said so.
  MOLIDO_ACCOUNT_RISK_PERCENT: ${MOLIDO_ACCOUNT_RISK_PERCENT:-}
  MOLIDO_AUTOTRADE_MAX_OPEN_POSITIONS: ${MOLIDO_AUTOTRADE_MAX_OPEN_POSITIONS:-8}
  MOLIDO_FORWARD_TIMEFRAMES: ${MOLIDO_FORWARD_TIMEFRAMES:-H1}
  MOLIDO_WATCHLIST: ${MOLIDO_WATCHLIST}

  # Execution. Listed here because this block is an allow-list, not a
  # pass-through: `--env-file` only feeds interpolation in this file, so a
  # variable set in .env.prod and absent from here never reaches the container.
  # Four of these were set on the server and silently did nothing, which is the
  # exact failure this explicitness is supposed to prevent in the other
  # direction - so every one of them names its own default below.
  #
  # Every default refuses. An unset variable must never be the reason an order
  # goes out.
  MOLIDO_ENABLE_EXECUTION: ${MOLIDO_ENABLE_EXECUTION:-false}
  MOLIDO_EXECUTION_DRY_RUN: ${MOLIDO_EXECUTION_DRY_RUN:-true}
  MOLIDO_TRADE_WITHOUT_PROVEN_EDGE: ${MOLIDO_TRADE_WITHOUT_PROVEN_EDGE:-false}
  # Separate from the three above on purpose: those are decisions about this
  # deployment, this is a decision about the account being traded.
  MOLIDO_ALLOW_REAL_MONEY_ORDERS: ${MOLIDO_ALLOW_REAL_MONEY_ORDERS:-false}
  MOLIDO_REQUIRE_AUTH: ${MOLIDO_REQUIRE_AUTH:-true}

  # Outbound mail, for account verification. Unset means this deployment does
  # not send, stated rather than silent.
  MOLIDO_SMTP_HOST: ${MOLIDO_SMTP_HOST:-}
  MOLIDO_SMTP_PORT: ${MOLIDO_SMTP_PORT:-587}
  MOLIDO_SMTP_USER: ${MOLIDO_SMTP_USER:-}
  MOLIDO_SMTP_PASSWORD: ${MOLIDO_SMTP_PASSWORD:-}
  MOLIDO_SMTP_FROM: ${MOLIDO_SMTP_FROM:-}
  MOLIDO_PUBLIC_BASE_URL: ${MOLIDO_PUBLIC_BASE_URL:-http://185.204.169.240}

  # Telegram, same rule: unset means off, never open.
  MOLIDO_TELEGRAM_BOT_TOKEN: ${MOLIDO_TELEGRAM_BOT_TOKEN:-}
  MOLIDO_TELEGRAM_CHAT_ID: ${MOLIDO_TELEGRAM_CHAT_ID:-}

  # Display timezone for logs and shells, at the owner's request. Safe only
  # because the schedule does not read it: the collector pins its arq cron
  # timezone to UTC in code, storage is timestamptz, and every datetime in
  # the app is constructed with an explicit UTC. Iran is +03:30 - if the
  # cron ever followed this value, the :00/:15/:30/:45 marks would slide
  # half an hour off the bar closes and every decision would trade the delay.
  TZ: Asia/Tehran

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # Docker gives a container 64MB of /dev/shm, and Postgres puts every
    # parallel query's shared workspace there. A VACUUM over the feature table
    # failed outright with "could not resize shared memory segment ... No
    # space left on device" - not a disk problem and not a memory problem, a
    # default nobody set. Parallel scans on the larger chunks were hitting the
    # same ceiling and quietly falling back to a single worker.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    logging: *logging

  # Runs migrations to completion, then exits. Everything else waits on it, so
  # no service can ever start against a schema it does not understand.
  migrate:
    build:
      context: ../backend
    restart: "no"
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # The seam between this container and MetaTrader on the host. The API
      # writes a broker-login request here and the host agent applies it; the
      # container never touches the terminal, its config or systemd.
      - ${MOLIDO_MT5_QUEUE_HOST:-/var/molido/mt5-queue}:/var/molido/mt5-queue
      # What the expert inside the terminal publishes. Read-only: the API reads
      # this feed and must never be able to write into MetaTrader's own folder,
      # where a stray file would be picked up as terminal data.
      - ${MOLIDO_MT5_BRIDGE_HOST:-/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files:ro
      # Every further terminal's bridge, read-only, one directory per
      # account. The site lists whatever `MOLIDO_MT5_BRIDGE_DIRS` names,
      # so a terminal missing from that env simply does not appear -
      # these mounts only make the directories reachable.
      - ${MOLIDO_MT5_BRIDGE_B:-/root/.mt5b/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/b:ro
      - ${MOLIDO_MT5_BRIDGE_C:-/root/.mt5c/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/c:ro
      - ${MOLIDO_MT5_BRIDGE_D:-/root/.mt5d/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/d:ro
      - ${MOLIDO_MT5_BRIDGE_E:-/root/.mt5e/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/e:ro
      - ${MOLIDO_MT5_BRIDGE_F:-/root/.mt5f/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/f:ro
      - ${MOLIDO_MT5_BRIDGE_G:-/root/.mt5g/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/g:ro
      - ${MOLIDO_MT5_BRIDGE_H:-/root/.mt5h/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/h:ro
      # The kill switch, on the host so it survives a redeploy. A halt that a
      # rebuild clears is not a halt, and a rebuild is exactly when somebody is
      # changing things and not thinking about the stop they set yesterday.
      #
      # Writable on the collector and read-only here, for the same reason as
      # the bridge: one process decides, the rest report.
      - ${MOLIDO_KILL_SWITCH_HOST:-/var/lib/molido}:/var/lib/molido:ro
      # MetaTrader's own log, read-only. One reason to mount it: when a login
      # fails the terminal writes exactly why - `(Invalid account)` needs a
      # different account, `(Invalid password)` needs a different password -
      # and inferring that instead of reading it produced two wrong diagnoses.
      - ${MOLIDO_MT5_LOG_HOST:-/home/ubuntu/.mt5/drive_c/Program Files/MetaTrader 5/logs}:/home/ubuntu/.mt5/drive_c/Program Files/MetaTrader 5/logs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    logging: *logging

  collector:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # The bridge, and writable here alone.
      #
      # The collector needs to read it because the equity sample rides on its
      # cycle - without the mount that sample reported "no heartbeat file"
      # forever while the terminal ran perfectly, a failure that looks
      # identical to a broken bridge and is not one.
      #
      # It needs to *write* it because this is the only process that places an
      # order, and an order is a file the expert picks up. Mounted read-only,
      # the first live cycle sized four positions correctly, sent all four, and
      # had every one rejected with "Read-only file system" - the design
      # reporting its own blocker per order, which is what it is for.
      #
      # The API keeps its read-only mount. Exactly one process can write an
      # order, and it is the one behind the autopilot's gates.
      - ${MOLIDO_MT5_BRIDGE_HOST:-/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files
      # Every further terminal's bridge, writable for the same reason the main
      # one is: this is the process that places orders, and an order is a file
      # the expert picks up. `run_all_accounts` walks these by key; a bridge
      # mounted only into the API is an account the fleet can see and the
      # trader cannot reach.
      - ${MOLIDO_MT5_BRIDGE_B:-/root/.mt5b/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/b
      - ${MOLIDO_MT5_BRIDGE_C:-/root/.mt5c/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/c
      - ${MOLIDO_MT5_BRIDGE_D:-/root/.mt5d/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/d
      - ${MOLIDO_MT5_BRIDGE_E:-/root/.mt5e/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/e
      - ${MOLIDO_MT5_BRIDGE_F:-/root/.mt5f/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/f
      - ${MOLIDO_MT5_BRIDGE_G:-/root/.mt5g/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/g
      - ${MOLIDO_MT5_BRIDGE_H:-/root/.mt5h/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/h
      # The kill switch, on the host so it survives a redeploy. A halt that a
      # rebuild clears is not a halt, and a rebuild is exactly when somebody is
      # changing things and not thinking about the stop they set yesterday.
      #
      # Writable here alone - this is the process that halts itself when a
      # limit is hit. Releasing it stays a human act on the host file.
      - ${MOLIDO_KILL_SWITCH_HOST:-/var/lib/molido}:/var/lib/molido
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["arq", "app.workers.collector.WorkerSettings"]
    # Overrides the image's healthcheck, which curls :8000. This worker has
    # never listened on a port, so that probe reported `unhealthy` for its
    # entire life while writing fifty-four bars a cycle with zero failures -
    # and a permanently red indicator is one nobody reads. This asks the
    # question that matters for a worker instead: did a cycle finish recently?
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3
    logging: *logging

  # The chat channel, deliberately alone on a process.
  #
  # It was a job on the collector's schedule and arrived twenty-five minutes
  # late, because one collection cycle takes minutes and the queue behind it
  # waits. A channel that goes quiet whenever the system is busy is quiet
  # exactly when somebody is asking because the system is busy.
  chat:
    build:
      context: ../backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # The update offset, beside the kill switch on the host so a redeploy
      # does not replay a day of questions.
      - ${MOLIDO_KILL_SWITCH_HOST:-/var/lib/molido}:/var/lib/molido
      # Every terminal's bridge, read-only. Without these the bot answers
      # "no heartbeat file" for every account while the collector reads them
      # perfectly - a channel reporting an outage that exists only inside
      # its own container, which is worse than no answer.
      - ${MOLIDO_MT5_BRIDGE_HOST:-/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/home/ubuntu/.mt5/drive_c/users/ubuntu/AppData/Roaming/MetaQuotes/Terminal/Common/Files:ro
      - ${MOLIDO_MT5_BRIDGE_B:-/root/.mt5b/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/b:ro
      - ${MOLIDO_MT5_BRIDGE_C:-/root/.mt5c/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/c:ro
      - ${MOLIDO_MT5_BRIDGE_D:-/root/.mt5d/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/d:ro
      - ${MOLIDO_MT5_BRIDGE_E:-/root/.mt5e/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/e:ro
      - ${MOLIDO_MT5_BRIDGE_F:-/root/.mt5f/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/f:ro
      - ${MOLIDO_MT5_BRIDGE_G:-/root/.mt5g/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/g:ro
      - ${MOLIDO_MT5_BRIDGE_H:-/root/.mt5h/drive_c/users/root/AppData/Roaming/MetaQuotes/Terminal/Common/Files}:/bridges/h:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.chat"]
    healthcheck:
      # Not pgrep: this image has no procps and the check exited 127 every
      # minute for the life of the container. Python is guaranteed here
      # because Python is what the container runs.
      test:
        [ "CMD-SHELL",
          "python -c \"import os,sys,time; p='/var/lib/molido/state/chat-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)\"" ]
      interval: 60s
      timeout: 10s
      retries: 3
    logging: *logging

  web:
    build:
      context: ../frontend
      args:
        # Server-side rendering calls the API over the compose network; the
        # browser never talks to it directly, so this stays internal.
        NEXT_PUBLIC_API_URL: http://api:8000
        # The footer stamp, and it belongs here rather than in the IP overlay.
        #
        # It lived in `docker-compose.ip.yml`, which is the overlay that also
        # takes Caddy off port 443 and swaps in the IP Caddyfile. So a domain
        # deployment - the only kind this project actually runs - had two
        # choices: no build stamp, or no HTTPS. It had been taking the first,
        # which is why every footer read "build dev / vdev / local" and why
        # "did the deploy land?" could only be answered by diffing page text.
        #
        # The defaults are the Dockerfile's own, so a build with none of these
        # set still succeeds and says so in the footer instead of claiming a
        # stamp it does not have.
        BUILD_STAMP: ${BUILD_STAMP:-dev}
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    environment:
      # Read at runtime, not baked into the build, and without the
      # NEXT_PUBLIC_ prefix - anything carrying that prefix is inlined into the
      # browser bundle, and a credential shipped to every visitor is not one.
      # Every page is a server component, so this header never leaves the
      # compose network.
      MOLIDO_INTERNAL_API_KEY: ${MOLIDO_INTERNAL_API_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      # Both default to the previous behaviour, so a deployment whose
      # .env.prod predates them keeps serving exactly as it did.
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
