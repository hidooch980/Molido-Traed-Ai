# Memory for one headless MetaTrader terminal, and who the kernel picks when
# the machine runs out.
#
# On 2026-09-07 the OOM killer ran three times in one day. Twice it chose
# postgres - the database holding the whole journal - and once a terminal's
# wineserver that had grown to 924 MB. Nothing on this host had a memory
# limit, so nine terminals could between them take the machine and the
# kernel picked the largest resident process, which is the database.
#
# MemoryHigh throttles and reclaims; MemoryMax is the wall. A terminal that
# hits the wall is killed and restarted by systemd ten seconds later, and
# it comes back with its account and its expert. A database killed
# mid-write is a different kind of event, and it is the one this file is
# here to stop happening.
#
# OOMScoreAdjust is the half that matters most: a cap decides how large a
# terminal may grow, this decides who dies when something else exhausts the
# machine anyway. Terminals volunteer.
[Service]
MemoryHigh=700M
MemoryMax=1200M
OOMScoreAdjust=600
