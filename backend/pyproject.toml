[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molidotrade-backend"
version = "0.1.0"
description = "MolidoTrade AI - trading intelligence, risk and execution platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
]
providers = [
    "yfinance>=0.2.48",
]

[project.scripts]
molido = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "N814"]
"app/db/alembic/*" = ["E501", "N999"]
# B008: `Depends(...)` in a default is the FastAPI idiom, not a mutable default.
"app/api/*" = ["B008"]
# N811: SQLAlchemy exports the type as `UUID`; `PgUUID` distinguishes it from
# the stdlib `uuid.UUID` in the same module.
"app/db/types.py" = ["N811"]
# S311: the demo generator makes reproducible fake candles, not secrets.
"app/seed/*" = ["S311"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test module imports `tests.conftest` for its fixtures, which needs this
# directory on sys.path. Locally an editable install happened to put it there
# and the omission was invisible; a modern PEP 660 editable install maps only
# the declared `app` package, so `tests` was not importable and every module
# failed at collection. That is what kept CI red for the project's entire
# history while the same suite passed on the same Python on the same OS.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
