    Molido<tspan fill="#1B6CA8">Trade</tspan>
  </text>
  <text x="152" y="92" font-family="'Segoe UI', 'Inter', system-ui, sans-serif"
        font-size="16" font-weight="500" letter-spacing="5.5" fill="#22D3EE">
    AI · TRADING INTELLIGENCE
  </text>
