name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy app
      - name: Tests
        # The suite runs on in-memory SQLite; no database service is needed.
        #
        # The tail of the output is echoed back as a workflow error because
        # annotations are the only part of a run readable without a token, and
        # this job spent the project's entire history reporting one line: exit
        # code 2. That is pytest's code for interrupted-at-collection, and it
        # names no file, no test and no reason.
        #
        # `tr` is given the newline as an octal code. Spelled with a backslash
        # it collapsed into a real line break inside this file, the workflow
        # stopped parsing, and the run failed with zero jobs - which reports
        # even less than the failure it was meant to explain.
        run: |
          set -o pipefail
          pytest -q --tb=short 2>&1 | tee /tmp/pytest.log || {
            echo "::error title=pytest::$(tail -c 2000 /tmp/pytest.log | tr '\012' '~')"
            exit 1
          }

  host:
    # The scripts that run on the machine itself, which the backend job never
    # sees: it sets `working-directory: backend`, so `ruff check .` has never
    # covered `infra/` and the guard's own tests have never run here at all.
    #
    # Both were found on 2026-09-08 by running them by hand. `infra/` had
    # seven lint findings, and the guard had spent that morning restarting two
    # terminals every fifteen minutes while they were still authorising - a
    # fault its tests catch and nothing was running them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.7"
      - name: Lint the whole repository
        run: ruff check .
      - name: The updater guard's own tests
        # A stubbed systemctl and a temporary tree of fake prefixes; nothing
        # is started, stopped or deleted. It is the only test of the one
        # script that can take a terminal down.
        run: bash infra/host/test-mt5-updater-guard.sh
      - name: Every host script parses
        run: |
          set -e
          for script in infra/*.sh infra/host/*.sh; do
            bash -n "$script"
            echo "ok  $script"
          done

  migration:
    # Proves migration 0001 applies against the real TimescaleDB image,
    # which the SQLite-backed unit suite cannot cover.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: molido
          POSTGRES_PASSWORD: molido
          POSTGRES_DB: molidotrade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U molido"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MOLIDO_DATABASE_URL: postgresql+psycopg://molido:molido@localhost:5432/molidotrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Verify hypertables exist
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from app.core.config import get_settings
          engine = create_engine(get_settings().database_url)
          with engine.connect() as conn:
              names = {
                  row[0]
                  for row in conn.execute(
                      text("SELECT hypertable_name FROM timescaledb_information.hypertables")
                  )
              }
          assert {"ohlcv", "ticks"} <= names, names
          print("hypertables:", sorted(names))
          PY
      - run: alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
